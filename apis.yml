name: Augur
description: 'Augur, Inc. was a Boulder, Colorado startup (founded 2012) that offered a
  cross-device attribution API using machine learning to recognize a unique device and its
  owner across laptops, phones, and tablets without relying on cookies, serving ad-tech and
  security customers to personalize experiences and improve conversion. Techstars-backed
  (also iGan Partners and Right Side Capital), Augur raised roughly $1.16M before being
  acquired by Wunderkind (formerly Bounce Exchange / BounceX) on 2017-05-04. The augur.io
  domain no longer resolves to a live product origin (Cloudflare edge returns HTTP 522) and
  no developer portal, API reference, or SDKs remain publicly reachable, so this profile is
  retained as an inactive/acquired historical record rather than a live API provider.'
